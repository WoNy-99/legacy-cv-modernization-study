<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Proposed modernization validation architecture</title>
  <desc id="desc">Proposed contracts, isolated components, correctness checks and later performance measurement. The architecture is not implemented.</desc>
  <rect width="1200" height="480" rx="22" fill="#101b2e"/>
  <g font-family="Arial, sans-serif">
    <text x="46" y="53" fill="#f8c77b" font-size="16" letter-spacing="2">PROPOSED DESIGN · NOT IMPLEMENTED</text>
    <text x="46" y="100" fill="#f3f6fc" font-size="32" font-weight="700">Compatibility before optimization</text>
    <g fill="#21324e" stroke="#51698c" stroke-width="1.5">
      <rect x="46" y="142" width="1106" height="62" rx="12"/>
      <rect x="46" y="244" width="330" height="105" rx="12"/>
      <rect x="434" y="244" width="330" height="105" rx="12"/>
      <rect x="822" y="244" width="330" height="105" rx="12"/>
    </g>
    <g fill="#f3f6fc" font-size="19" text-anchor="middle">
      <text x="600" y="180">Explicit contracts: input · preprocessing · numerical behavior · configuration</text>
      <text x="211" y="283">Isolated component work</text>
      <text x="599" y="283">Correctness and stability</text>
      <text x="987" y="283">Performance experiments</text>
    </g>
    <g fill="#bdc9df" font-size="16" text-anchor="middle">
      <text x="211" y="314">Small changes, preserved behavior</text>
      <text x="599" y="314">Reference required for parity claims</text>
      <text x="987" y="314">Fixed conditions, one variable</text>
    </g>
    <g stroke="#65d6ce" stroke-width="3" fill="none">
      <path d="M211 204v35m-7-7 7 7 7-7M599 204v35m-7-7 7 7 7-7M987 204v35m-7-7 7 7 7-7M381 296h47m-7-7 7 7-7 7M769 296h47m-7-7 7 7-7 7"/>
    </g>
    <text x="46" y="405" fill="#f8c77b" font-size="18">Current output: documentation + illustrative config + CPU timing template</text>
    <text x="46" y="439" fill="#93a8c8" font-size="15">No validated migration, GPU benchmark, or end-to-end implementation is provided.</text>
  </g>
</svg>
